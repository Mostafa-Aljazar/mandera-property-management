          type: integer
          example: 5000
        days_overdue:
          type: integer
          example: 15
        overdue_since_label:
          type: string
          example: 1 أبريل 2024
        last_payment_date_label:
          type: string
          example: 1 مارس 2024

    OverdueSummary:
      type: object
      description: >-
