        property_name:
          type: string
          example: برج الياسمين
        tenant_name:
          type: string
          example: أحمد محمد عبد الله
        rent_value:
          type: integer
          example: 60000
        unit_label:
          type: string
          example: شقة 402
        start_date_label:
          type: string
          example: 1 يناير 2024
        end_date_label:
          type: string
          example: 31 ديسمبر 2024
        deposit_amount:
          type: integer
          default: 0
          example: 5000
        document_file_name:
          type: string
          nullable: true
          example: عقد الإيجار الموحد.pdf
        document_size_label:
          type: string
          nullable: true
          example: 2.4 MB
        installments:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/ContractInstallment"

    CreateContractRequest:
      type: object
      description: >-
        EXACT — CreateContractRequest.toFormData(). ⚠️ Sent as multipart/
        form-data despite having NO file field — see
        x-backend-decisions-required: create-contract-formdata-quirk.
        `payments` is transmitted as a JSON-ENCODED STRING (the serialized
        form of an array of {amount, date} objects), not a native JSON
        array, because Dio's FormData stringifies every field.
      required:
        - tenant_id
        - property_id
        - unit_id
        - start_date
        - end_date
        - total_rent_value
        - deposit_amount
        - payments
      properties:
        tenant_id:
          type: string
          example: "1"
        property_id:
          type: string
          example: "1"
        unit_id:
          type: string
          example: "101"
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        total_rent_value:
          type: number
          format: double
          example: 60000.0
        deposit_amount:
          type: number
          format: double
          example: 5000.0
        payments:
          type: string
          description: >-
            JSON-encoded string of `[{"amount": number, "date": ISO8601
            string}, ...]` — a flexible, user-defined installment
            schedule. Sent as a string, not a native array, due to the
            FormData transport (see schema description above).
          example: '[{"amount":5000,"date":"2024-01-01T00:00:00.000"},{"amount":5000,"date":"2024-02-01T00:00:00.000"}]'
        notes:
          type: string
          nullable: true

