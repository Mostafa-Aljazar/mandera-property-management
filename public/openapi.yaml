    # =========================================================================
    # Uploads (backend addition)
    # =========================================================================
    UploadBucket:
      type: string
      description: Which public Supabase Storage bucket the file belongs in.
      enum:
        - property-images
        - unit-images
        - tenant-photos
        - tenant-documents
        - maintenance-images
        - payment-receipts

    UploadSignRequest:
      type: object
      required: [bucket, content_type]
      properties:
        bucket:
          $ref: "#/components/schemas/UploadBucket"
        content_type:
          type: string
          description: >-
            MIME type of the file to upload. Must be one of the bucket's
            allowed types (image/jpeg, image/png, image/webp; also
            application/pdf for payment-receipts).
          example: image/jpeg

    UploadSignResponse:
      type: object
      required: [bucket, path, token, signed_url, public_url]
      properties:
        bucket:
          $ref: "#/components/schemas/UploadBucket"
        path:
          type: string
          description: Storage path the file will live at (owner-scoped).
          example: 3f1b2c.../1739999999999-a1b2c3.jpg
        token:
          type: string
          description: Upload token paired with `signed_url`.
        signed_url:
          type: string
          format: uri
          description: PUT the raw file bytes here directly (bypasses this API entirely).
        public_url:
          type: string
          format: uri
          description: >-
            The file's permanent public URL once uploaded — send this string
            back to the target create endpoint's file field instead of
            binary data.
