# =============================================================================
# Mandera Management — Backend API Contract (reverse-engineered)
# =============================================================================
# This file was generated by reading the Flutter client's source code, NOT a
# live backend (the project has no real backend yet — see EndPoints.baseUrl,
# a placeholder domain). Every path, method, and field below is traced back
# to something that actually exists in the Dart code: `endpoint.dart`,
# repository implementations, Cubits, and request/response models.
#
# Two grades of confidence are used throughout this file:
#   - EXACT   — the schema mirrors an explicit `fromJson`/`toJson`/
#               `toFormData` in the Dart code. This is a verified contract.
#   - INFERRED — the model has no JSON (de)serializer in the code (it's only
#               ever built from Dart demo-data constants). The schema is
#               derived from the Dart field names via the snake_case
#               convention the *other*, EXACT models establish. Each such
#               schema is marked "(inferred)" in its description.
#
# Nothing here was invented beyond what the code implies. Anything unclear,
# inconsistent, or unverifiable is called out below AND in the
# `x-backend-decisions-required` block in `info`, not silently resolved.
#
# BACKEND DECISIONS REQUIRED (see also info.x-backend-decisions-required):
#  1. RESOLVED — POST /auth/login and POST /auth/refresh are now fully
#     implemented and live (src/app/api/v1/auth/login/route.ts,
#     src/app/api/v1/auth/refresh/route.ts), backed by Supabase Auth. This
#     note originally flagged that the Flutter client's AuthRepository.login()
#     returned a hardcoded demo session instead of hitting the network; that
#     no longer describes the backend's behavior, only historical mobile-app
#     state at the time this file was first drafted.
#  2. POST /auth/send-otp and POST /auth/verify-otp are declared in
#     endpoint.dart but are not referenced by any repository, cubit, or
#     screen — zero request/response models exist for them. The schemas
#     below are a minimal best-guess placeholder. Confirm the real contract
#     with the mobile team before building against them.
#  3. Every GET list endpoint currently takes NO parameters. The Flutter
#     client fetches the full collection once and does searching/filtering/
#     sorting entirely client-side in the Cubit (see e.g. TenantsCubit.
#     search()/setFilter()). No pagination or query params are consumed
#     today, so none are documented as query parameters here — but you will
#     almost certainly want to add page/page_size/search/status params for
#     production scale. That is a backend design decision, not something
#     inferable from the current client.
#  4. Every "create" repository method returns Future<void> in Flutter — the
#     client discards the response body entirely on every POST endpoint
#     (tenants, properties, units, payments, contracts, expenses,
#     maintenance-requests). The 201 response schemas below return the
#     created resource as a conventional REST default; the backend is free
#     to choose any 2xx body shape since nothing in the app currently reads
#     it.
#  5. Only Property/PropertiesSummary, DashboardSummary (+ its nested
#     models), and LoginResponse have explicit fromJson parsing in the Dart
#     code. Every other response schema (Tenant, Unit, Payment, Contract,
#     Expense, MaintenanceRequest, OverdueSummary/OverdueTenant,
#     UserProfile) is INFERRED — treat those as a well-grounded draft, not a
#     verified contract, until a backend actually exists to check against.
#  6. List/detail response models return PRE-FORMATTED display strings for
#     dates (e.g. `date_label: "2024/05/02"`, `end_date_label: "31 ديسمبر
#     2024"`), never a raw ISO date. Nothing in these models parses a real
#     DateTime from JSON. This implies the backend is expected to render
#     already-localized date strings rather than the client formatting raw
#     timestamps. Decide if that's really what you want (simpler client, no
#     client-side i18n control) or switch to ISO dates + client formatting.
#  7. No "get by id" / details endpoints are used anywhere. Every details
#     screen (tenant/property/unit/contract) receives its full object via
#     in-app navigation arguments from the already-fetched list — none call
#     a dedicated GET /{resource}/{id}. None are documented here since
#     nothing consumes them, but you'll likely want standard
#     GET /{resource}/{id} endpoints regardless, for deep links and
#     refresh-after-navigation.
#  8. POST /contracts sends multipart/form-data with NO actual file field.
#     The flexible payment schedule (`payments`) is embedded as a
#     JSON-ENCODED STRING, not a native JSON array, because Dio's FormData
#     stringifies every field. Documented faithfully below; recommend either
#     accepting that shape as-is, or flagging to the Flutter team that this
#     endpoint should just be application/json since no file is involved.
#  9. Currency amounts mix `int` and `double` across the codebase: list/
#     detail response models use whole-number `int` (e.g. Payment.amount,
#     Expense.amount), while every create-request's amount field
#     (CreatePaymentRequest.amount, CreateExpenseRequest.amount,
#     CreateContractRequest.totalRentValue/depositAmount) is `double`.
#     Preserved faithfully below; recommend the team agree on one
#     consistent numeric representation for money.
# 10. The MaintenanceRequest list/detail model has NO `category` field, even
#     though POST /maintenance-requests accepts one. Looks like an
#     oversight — the create form captures category but the list-display
#     model was never extended to surface it. Flag to the Flutter team.
# 11. Enum wire values are INFERRED for enums that don't define an explicit
#     `apiValue` in Dart: TenantStatus, ContractStatus, InstallmentStatus,
#     PaymentStatus, MaintenancePriority, RentPeriod. The inference follows
#     the snake_case convention firmly established by every enum that DOES
#     define `apiValue` explicitly (PaymentMethod, PropertyType, UnitType,
#     UnitStatus, MaintenanceCategory) and by DashboardAlertType's own
#     fromApiValue() mapping. MaintenanceStatus.newRequest in particular is
#     a guess (`new_request`) — it could plausibly just be `new`; confirm
#     with the Flutter team.
# 12. Resource `id` fields are typed as string, but Property.fromJson
#     defensively does `json['id'].toString()` — implying the backend might
#     legitimately send a numeric id today. Recommend standardizing on
#     string ids for every resource.
# 13. Password rules are inconsistent in the Flutter code: RegexManager.
#     isPasswordValid() requires 6+ characters but is dead code — the rule
#     actually enforced in the UI (CustomTextField/TextFieldType.password)
#     requires 8+. This spec documents minLength: 8 (the one truly
#     enforced); flag the unused 6-char rule to the Flutter team.
# 14. No notifications endpoint exists in the code at all — the
#     notifications screen is a static "empty" placeholder with no model,
#     repository, or EndPoints constant. Not included in this spec; a real
#     notifications feed is a new capability to scope, not something
#     inferable from existing code.
# 15. `country_code`/`nationality_code` are ISO 3166-1 alpha-2 codes (e.g.
#     "SA"), resolved client-side from a local country-name → ISO-code map
#     since the Flutter country picker package doesn't provide them.
#     `country`/`nationality` are the plain English country name string.
# 16. Brokers (POST/GET /brokers) exist fully in the Flutter client
#     (create-broker screen, broker list/search) but were missing entirely
#     from earlier drafts of this spec — added here. `POST /brokers` is
#     wired to the network; `GET /brokers` still returns Flutter demo data
#     (see BrokersRepository.getBrokers TODO). The broker's identifying
#     document field was recently renamed client-side from `national_id` to
#     `commercial_license_number` — brokers are treated as licensed
#     businesses/offices, not individuals, unlike tenants (who keep
#     `national_id`).
# 17. POST /units/vacant-report/send is a real, wired endpoint
#     (UnitsRepository.sendVacantUnitsReport) with no corresponding
#     EXPLICIT feature tag before now — the Flutter client renders a PDF of
#     vacant units client-side and uploads the finished file bytes plus a
#     `broker_id` for the backend to deliver to that broker. No response
#     body is read (Future<void>).
# 18. The create-property screen's country picker is now restricted
#     client-side to three markets — United Arab Emirates (AE), Oman (OM),
#     Saudi Arabia (SA) — out of the ~250-country bundled dataset. This is
#     a Flutter-side UI filter only (see CreatePropertyView.
#     _allowedCountryIsoCodes); `country_code`/`country` in
#     CreatePropertyRequest are still plain strings with no server-side
#     enum. Decide whether the backend should also validate/enforce this
#     restriction, or treat it as advisory. Note this restriction does NOT
#     apply to broker/tenant nationality pickers, which still list all
#     countries.
# =============================================================================

openapi: 3.0.3

info:
  title: Mandera Management API
  description: >-
    Property/tenant/contract/payment/expense/maintenance management backend.
    Served copy of the spec the mobile team sent
    (`docs/new/openapi.yaml`, reverse-engineered from the Flutter client) —
    every path/schema below is implemented and live at `/api/v1/*` in this
    repo, matching the mobile team's contract exactly (including plain
    `multipart/form-data` binary file uploads on every create endpoint, as
    originally specified). One OPTIONAL addition beyond the original file:
    `POST /uploads/sign` (tag "Uploads") — NOT part of the mobile team's
    contract and NOT required. It exists only as an opt-in alternative for
    files too large for Vercel's ~4.5MB request body cap: the client may
    request a Supabase signed upload URL, upload directly to it, then pass
    the resulting public URL as a string in the same file field instead of
    raw binary. Every create endpoint accepts either form. See
    `docs/openapi-issues.md` §8 for details. Everything else — description,
    decisions-required notes, and all original schemas — is unchanged from
    the mobile team's file; do not treat this copy as a redefinition of
    their contract.
  version: 1.1.0
  x-backend-decisions-required:
    - id: login-not-wired
      summary: >-
        RESOLVED — POST /auth/login and POST /auth/refresh are implemented
        and live, backed by Supabase Auth (email/phone identifier, owner
        role + rank, refresh_token). No longer inferred/unverified.
    - id: otp-endpoints-unused
      summary: >-
        auth/send-otp and auth/verify-otp have no consuming Flutter code
        (no models, no repository methods, no screens). Placeholder schemas
        only — confirm real contract before building.
    - id: no-query-params-consumed
      summary: >-
        All GET list endpoints are called with zero parameters today;
        filtering/search/sort happen client-side on the full collection.
        No pagination/filter query params are documented since none exist
        in the current client, though the backend will likely want them.
    - id: create-endpoints-ignore-response
      summary: >-
        Every create/POST repository method is `Future<void>` in Flutter —
        the response body is never read. 201 schemas below are a
        conventional-REST default, not a verified requirement.
    - id: most-response-models-inferred
      summary: >-
        Only Property/PropertiesSummary, DashboardSummary (+ nested), and
        LoginResponse have explicit fromJson parsing. Every other response
        schema is inferred from Dart field names via the codebase's
        snake_case convention.
    - id: date-fields-are-preformatted-labels
      summary: >-
        List/detail responses use pre-formatted "*_label" display strings
        for dates, never raw ISO timestamps — implying the backend is
        expected to render already-localized text, not just data.
    - id: no-get-by-id-endpoints-used
      summary: >-
        Details screens receive full objects via in-app navigation
        arguments from the list already fetched; no GET /{resource}/{id}
        is called anywhere in the app today.
    - id: create-contract-formdata-quirk
      summary: >-
        POST /contracts sends multipart/form-data with no file field at
        all; its `payments` array is embedded as a JSON-encoded STRING due
        to Dio FormData stringifying every value.
    - id: currency-type-inconsistency
      summary: >-
        Money fields are `int` in list/detail responses but `double` in
        every create-request's amount field. Preserved as-is; recommend
        picking one representation.
    - id: maintenance-request-missing-category
      summary: >-
        The MaintenanceRequest response model has no `category` field even
        though the create endpoint accepts one — likely a Flutter oversight.
    - id: inferred-enum-wire-values
      summary: >-
        TenantStatus, ContractStatus, InstallmentStatus, PaymentStatus,
        MaintenancePriority, and RentPeriod have no explicit `apiValue` in
        Dart; snake_case wire values are inferred from the pattern
        established by enums that do define one.
        MaintenanceStatus.newRequest → `new_request` is a guess and could
        plausibly just be `new`.
    - id: id-type-inconsistency
      summary: >-
        Property.fromJson defensively stringifies `id`
        (`json['id'].toString()`), implying the backend may send a numeric
        id today. Recommend standardizing on string ids everywhere.
    - id: password-rule-inconsistency
      summary: >-
        RegexManager.isPasswordValid() (6+ chars) is dead code; the UI
        actually enforces 8+ via CustomTextField. Spec documents
        minLength: 8.
    - id: no-notifications-endpoint
      summary: >-
        The notifications screen is a static empty-state placeholder with
        no backing model, repository, or endpoint constant anywhere in the
        code. Not included in this spec.
    - id: country-code-format
      summary: >-
        country_code/nationality_code are ISO 3166-1 alpha-2 codes (e.g.
        "SA"), resolved client-side from a static name→code map.
    - id: brokers-added
      summary: >-
        POST/GET /brokers were missing from earlier drafts of this spec
        despite being fully implemented client-side; added now. POST is
        wired to the network, GET still returns demo data. The broker
        identity field was recently renamed from national_id to
        commercial_license_number (brokers are licensed businesses, not
        individuals).
    - id: vacant-units-report-endpoint
      summary: >-
        POST /units/vacant-report/send is a real, wired endpoint newly
        documented here: the client renders a vacant-units PDF and uploads
        it with a broker_id for the backend to deliver. Response body
        unread (Future<void>).
    - id: property-country-restricted-client-side
      summary: >-
        The create-property country picker is now filtered client-side to
        AE/OM/SA only, out of the full bundled country list. Purely a
        Flutter UI restriction — country_code/country remain unconstrained
        strings server-side. Decide if the backend should also enforce
        this. Broker/tenant nationality pickers are unaffected and still
        list every country.

servers:
  - url: https://mandera-property-management.vercel.app/api/v1
    description: Live backend deployment.

tags:
  - name: Auth
    description: Login, registration, password recovery, OTP.
  - name: Profile
    description: The signed-in user's own account/profile.
  - name: Tenants
    description: Tenant records and their lease/document summaries.
  - name: Brokers
    description: Real estate broker/agency directory.
  - name: Team
    description: Company team members managed by the owner account.
  - name: Properties
    description: Property (building/compound) records.
  - name: Units
    description: Individual rentable units within a property.
  - name: Payments
    description: Rent payment records, including overdue tracking.
  - name: Contracts
    description: Lease contracts and their installment schedules.
  - name: Expenses
    description: Property/unit operating expenses.
  - name: Maintenance
    description: Tenant-reported maintenance requests.
  - name: Dashboard
    description: Aggregated home-screen summary data.
  - name: Uploads
    description: >-
      Backend addition, not in the mobile team's original file — see
      docs/openapi-issues.md §8. Lets clients upload directly to Supabase
      Storage instead of embedding file bytes in a POST to this API.

security:
  - bearerAuth: []

paths:
  # ===========================================================================
  # Auth
  # ===========================================================================
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Log in with an identifier (email/phone) and password
      description: >-
        Implemented and live — authenticates against Supabase Auth, resolves
        a phone identifier to its account email, and requires role=owner.
        Returns token, refresh_token, expires_in, role, and rank.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid identifier or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/refresh:
    post:
      operationId: refresh
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      description: >-
        Implemented and live — backend addition beyond the mobile team's
        original file, pairing with LoginResponse.refresh_token. Exchanges a
        Supabase refresh token for a new session (token, refresh_token,
        expires_in, role, rank).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New access token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Refresh token is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Create a new account
      description: >-
        Wired in Flutter via DioHelper.postData — the client sends this
        request but ignores the response body (RegisterCubit only reacts to
        success/failure, not any returned data).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created.
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account with this email or phone already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [Auth]
      summary: Request a password-reset for the given identifier
      description: >-
        Wired in Flutter via DioHelper.postData; the client only reacts to
        success/failure, not any returned data.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset instructions sent (if the identifier exists).
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/send-otp:
    post:
      operationId: sendOtp
      tags: [Auth]
      summary: Send a one-time verification code
      description: >-
        ⚠️ UNVERIFIED — defined in endpoint.dart but not referenced by any
        Flutter model, repository, cubit, or screen. See
        x-backend-decisions-required: otp-endpoints-unused. The request body
        below is a minimal, best-guess placeholder (an identifier to send
        the code to), NOT derived from any actual Dart model.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier:
                  type: string
                  description: Email or phone to send the OTP to (guessed field name).
                  example: "+966501234567"
      responses:
        "200":
          description: OTP sent.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [Auth]
      summary: Verify a one-time code
      description: >-
        ⚠️ UNVERIFIED — same status as /auth/send-otp; see
        x-backend-decisions-required: otp-endpoints-unused. Placeholder
        schema only.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code]
              properties:
                identifier:
                  type: string
                  example: "+966501234567"
                code:
                  type: string
                  description: The OTP code entered by the user (guessed field name).
                  example: "123456"
      responses:
        "200":
          description: OTP verified.
        "400":
          description: Invalid or expired code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  # ===========================================================================
  # Profile
  # ===========================================================================
  /user/profile:
    get:
      operationId: getProfile
      tags: [Profile]
      summary: Get the signed-in user's profile
      description: >-
        GET endpoint currently served entirely from Flutter demo data (see
        ProfileRepository.getProfile). No fromJson exists on UserProfile —
        schema is INFERRED from the model's field names.
      responses:
        "200":
          description: The current user's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  # ===========================================================================
  # Tenants
  # ===========================================================================
  /tenants:
    get:
      operationId: getTenants
      tags: [Tenants]
      summary: List all tenants
      description: >-
        Currently served from Flutter demo data (see
        TenantsRepository.getTenants). Called with no parameters — search/
        filter happen client-side. Tenant has no fromJson; schema INFERRED.
      responses:
        "200":
          description: All tenants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      operationId: createTenant
      tags: [Tenants]
      summary: Create a tenant
      description: >-
        Wired via DioHelper.postData with multipart/form-data (two required
        photo uploads). CreateTenantCubit discards the response body
        (Future<void>) — see x-backend-decisions-required:
        create-endpoints-ignore-response.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  # ===========================================================================
  # Brokers
  # ===========================================================================
  /brokers:
    get:
      operationId: getBrokers
      tags: [Brokers]
      summary: List all brokers
      description: >-
        Currently served from Flutter demo data (see
        BrokersRepository.getBrokers TODO) — called with no parameters,
        search happens client-side over the full list. Broker has no
        fromJson; schema INFERRED.
      responses:
        "200":
          description: All brokers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Broker"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      operationId: createBroker
      tags: [Brokers]
      summary: Create a broker
      description: >-
        Wired via DioHelper.postData with multipart/form-data (one required
        personal photo). CreateBrokerCubit discards the response body
        (Future<void>). The broker's identifying document is
        `commercial_license_number` (brokers are treated as licensed
        businesses/offices, not individuals — see
        x-backend-decisions-required: brokers-added).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateBrokerRequest"
      responses:
        "201":
          description: Broker created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Broker"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  # ===========================================================================
  # Team
  # ===========================================================================
  /team-members:
    get:
      operationId: getTeamMembers
      tags: [Team]
      summary: List the company's team members
      responses:
        "200":
          description: Team members in the authenticated owner's company.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTeamMember
      tags: [Team]
      summary: Create a team member account (manager, administrator, or assistant)
      description: >-
        Only a manager may create team members. The organization is derived
        from the authenticated manager; it is never supplied by the client.
        The new account has role `owner` and any rank — `manager`,
        `administrator`, or `assistant` — with no limit on how many accounts
        of a given rank (including `manager`) a company may have.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamMemberRequest"
      responses:
        "201":
          description: Team member created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only a manager can create team members.
        "409":
          description: Email already exists.

  # ===========================================================================
  # Properties
  # ===========================================================================
  /properties:
    get:
      operationId: getProperties
      tags: [Properties]
      summary: List all properties with portfolio-level stats
      description: >-
        Currently served from Flutter demo data (see
        PropertiesRepository.getProperties). PropertiesSummary AND Property
        both have an explicit fromJson in the Dart code — this schema is
        EXACT, not inferred.
      responses:
