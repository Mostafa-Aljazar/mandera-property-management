      description: >-
        ⚠️ OPTIONAL — not part of the mobile team's contract and not
        required. Every create endpoint works with a plain
        `multipart/form-data` binary file exactly as the original spec
        documents; this endpoint is only an opt-in alternative for files too
        large for Vercel's ~4.5MB request body cap (see
        docs/openapi-issues.md §8). Call this first, PUT the file to
        `signed_url`, then submit `public_url` as a plain string in the same
        multipart field the target endpoint documents as `format: binary`
        (e.g. `photo`, `personal_photo`, `id_photo`, `images[]`, `receipt`)
