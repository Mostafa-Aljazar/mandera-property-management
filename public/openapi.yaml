components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque token
      description: >-
        `Authorization: Bearer <token>`, attached by DioHelper's request
        interceptor whenever a token is present in local storage (saved
        after login as HiveHelper.saveToken). Public auth endpoints
        (login/register/forgot-password/send-otp/verify-otp) override this
        with `security: []`.

  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # =========================================================================
    # Shared
    # =========================================================================
    ErrorResponse:
      type: object
      description: >-
        EXACT — derived from Failure.from()'s Dio error handling
        (core/error/failures.dart): on a non-2xx JSON response, the client
        reads `response.data['message']` and displays it directly; if that
        field is missing, it falls back to a generic translated "server
        error" string instead. A top-level string `message` is therefore
        the one field every error response MUST include for the app to
        surface a useful message. No other error field (codes, per-field
        validation arrays, etc.) is read by the client anywhere in the
        code — the backend is free to add more, but `message` is the only
        one that matters today.
      required: [message]
      properties:
        message:
          type: string
          example: Invalid national ID format.

    # =========================================================================
    # Auth
    # =========================================================================
    LoginRequest:
      type: object
      description: EXACT — LoginRequest.toJson().
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email or phone number.
          example: ahmed.m@example.com
        password:
          type: string
          format: password
          minLength: 8
      example:
        identifier: ahmed.m@example.com
        password: SecurePass123

    LoginResponse:
      type: object
      description: >-
        EXACT — LoginResponse.fromJson(). Note `user_id` is read via
        `json['user_id'].toString()`, i.e. the client tolerates either a
        string or a number here (see x-backend-decisions-required:
        id-type-inconsistency); `token` must be a JSON string.
      required: [user_id, token, refresh_token, expires_in, role, rank]
      properties:
        user_id:
          type: string
          example: "42"
        token:
          type: string
          description: >-
            Opaque bearer token, stored and replayed as
            `Authorization: Bearer <token>` on every subsequent request.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: >-
            Supabase refresh token, used to obtain a new access token once
            `token` expires.
          example: v1.M2QzZjZlYzYtYzQ5OS00...
        expires_in:
          type: integer
          description: Seconds until `token` expires, from the moment it was issued.
          example: 3600
        role:
          type: string
          enum: [owner, master_admin]
        rank:
          allOf:
            - $ref: "#/components/schemas/UserRank"
          nullable: true

    RefreshRequest:
      type: object
      description: >-
        Backend addition, not in the mobile team's original file — used by
        /auth/refresh to consume LoginResponse.refresh_token.
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          example: v1.M2QzZjZlYzYtYzQ5OS00...

    RegisterRequest:
      type: object
      description: EXACT — RegisterRequest.toJson().
      required: [username, email, phone, password]
      properties:
        username:
          type: string
          example: ahmed_m
        email:
          type: string
          format: email
          example: ahmed.m@example.com
        phone:
          type: string
          example: "+966501234567"
        password:
          type: string
          format: password
          minLength: 8

    ForgotPasswordRequest:
      type: object
      description: EXACT — ForgotPasswordRequest.toJson().
      required: [identifier]
      properties:
        identifier:
          type: string
          description: Email or phone number to send reset instructions to.
          example: ahmed.m@example.com

    # =========================================================================
    # Profile
    # =========================================================================
    UserProfile:
      type: object
      description: >-
        INFERRED — UserProfile has no fromJson; field names snake_cased
        from the Dart model.
      required: [role, rank, full_name, job_title, phone, email, avatar_url]
      properties:
        full_name:
          type: string
          example: أحمد المحمد
        job_title:
          type: string
          example: مدير عقارات أول
        phone:
          type: string
          example: "+966 50 123 4567"
        email:
          type: string
          format: email
          example: ahmed@mandera.com
        avatar_url:
          type: string
          format: uri
          example: https://i.pravatar.cc/150?img=12
        role:
          type: string
          enum: [owner, master_admin]
        rank:
          allOf:
            - $ref: "#/components/schemas/UserRank"
          nullable: true

    UserRank:
      type: string
      description: Company position, separate from the account role.
      enum: [manager, administrator, assistant]

    TeamMember:
      type: object
      required: [id, full_name, email, phone, role, rank]
      properties:
        id:
          type: string
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [owner]
        rank:
          $ref: "#/components/schemas/UserRank"
        created_at:
          type: string
          format: date-time

    CreateTeamMemberRequest:
      type: object
      required: [full_name, email, phone, password, rank]
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        rank:
          $ref: "#/components/schemas/UserRank"

    # =========================================================================
    # Tenants
    # =========================================================================
    TenantStatus:
      type: string
      description: INFERRED wire values (no explicit apiValue in Dart).
      enum: [active, expiring_soon, overdue]

    TenantDocument:
      type: object
      description: INFERRED — nested in Tenant.contract.documents.
      required: [title, file_type_label, file_size_label]
      properties:
        title:
          type: string
          example: عقد الإيجار السكني الموحد
        file_type_label:
          type: string
          example: PDF
        file_size_label:
          type: string
          example: 2.4 MB

    TenantContract:
      type: object
      description: >-
        INFERRED — the tenant's active lease, as shown on their details
        screen. All date fields are pre-formatted display strings, not ISO
        dates (see x-backend-decisions-required:
        date-fields-are-preformatted-labels).
      required:
        - total_paid
        - remaining_amount
        - next_payment_date_label
        - start_date_label
        - end_date_label
        - progress_percent
      properties:
        total_paid:
          type: integer
          example: 60000
        remaining_amount:
          type: integer
          example: 0
        next_payment_date_label:
          type: string
          example: 1 مايو 2024
        start_date_label:
          type: string
          example: 1 يناير 2024
        end_date_label:
          type: string
          example: 31 ديسمبر 2024
        progress_percent:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.76
        documents:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/TenantDocument"

    Tenant:
      type: object
      description: INFERRED — Tenant has no fromJson; field names snake_cased.
      required:
        - id
        - full_name
        - national_id
        - phone
        - is_verified
        - unit_type_label
        - property_unit_label
        - monthly_rent
        - is_rent_paid
        - status
      properties:
        id:
          type: string
          example: "1"
        full_name:
          type: string
          example: أحمد محمد عبد الله
        national_id:
          type: string
          example: "1234567890"
        phone:
          type: string
          example: 4567 123 050
        email:
          type: string
          format: email
          nullable: true
          example: ahmed.m@example.com
        avatar_url:
          type: string
          format: uri
          nullable: true
          example: https://i.pravatar.cc/150?img=12
        is_verified:
          type: boolean
          default: false
        unit_type_label:
          type: string
          description: e.g. the unit's display type/number, shown in the tenant card.
          example: شقة 402
        property_unit_label:
          type: string
          example: برج الياسمين - 01
        monthly_rent:
          type: integer
          example: 5000
        is_rent_paid:
          type: boolean
        status:
          $ref: "#/components/schemas/TenantStatus"
        overdue_label:
          type: string
          nullable: true
          description: Human-readable overdue duration, only present when overdue.
          example: شهران
        contract:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TenantContract"

    CreateTenantRequest:
      type: object
      description: >-
        EXACT — CreateTenantRequest.toFormData(). Sent as multipart/
        form-data (two required file uploads).
      required:
        - full_name
        - national_id
        - nationality_code
        - nationality
        - email
        - phone
        - mobile
        - personal_photo
        - id_photo
      properties:
        full_name:
          type: string
        national_id:
          type: string
        nationality_code:
          type: string
          description: >-
            ISO 3166-1 alpha-2 (see x-backend-decisions-required:
            country-code-format).
          example: SA
        nationality:
          type: string
          example: Saudi Arabia
        email:
          type: string
          format: email
        phone:
          type: string
        mobile:
          type: string
        personal_photo:
          type: string
          format: binary
        id_photo:
          type: string
          format: binary

    # =========================================================================
    # Brokers
    # =========================================================================
    Broker:
      type: object
      description: >-
        INFERRED — Broker has no fromJson; field names snake_cased. A
        broker represents a licensed real-estate agency/office, not an
        individual — hence commercial_license_number rather than a
        national ID (see x-backend-decisions-required: brokers-added).
      required:
        - id
        - full_name
        - commercial_license_number
        - phone
        - mobile
        - nationality_label
      properties:
        id:
          type: string
          example: "1"
        full_name:
          type: string
          example: عبد الرحمن سعيد القحطاني
        company_name:
          type: string
          nullable: true
          example: شركة القحطاني العقارية
        commercial_license_number:
          type: string
          example: "1122334455"
        phone:
          type: string
          example: 2233 456 011
        mobile:
          type: string
          example: "966502233445"
        email:
          type: string
          format: email
          nullable: true
          example: abdulrahman.q@example.com
        avatar_url:
          type: string
          format: uri
          nullable: true
          example: https://i.pravatar.cc/150?img=15
        nationality_label:
          type: string
          example: السعودية
        is_verified:
          type: boolean
          default: false

    CreateBrokerRequest:
      type: object
      description: >-
        EXACT — CreateBrokerRequest.toFormData(). Sent as multipart/
        form-data (one required personal photo). `company_name` is a
        non-nullable String field (always sent) even though the UI marks it
        optional — an unfilled field arrives as an empty string, not an
        omitted key.
      required:
        - full_name
        - company_name
        - commercial_license_number
        - nationality_code
        - nationality
        - email
        - phone
        - mobile
        - personal_photo
      properties:
        full_name:
          type: string
        company_name:
          type: string
          description: Always present; empty string when the user leaves it blank.
        commercial_license_number:
          type: string
        nationality_code:
          type: string
          description: >-
            ISO 3166-1 alpha-2 (see x-backend-decisions-required:
            country-code-format).
          example: SA
        nationality:
          type: string
          example: Saudi Arabia
        email:
          type: string
          format: email
        phone:
          type: string
        mobile:
          type: string
        personal_photo:
          type: string
          format: binary

    # =========================================================================
    # Properties
    # =========================================================================
    PropertyType:
      type: string
      description: EXACT — PropertyType.apiValue.
      enum: [residential, commercial, mixed_use]

    Property:
      type: object
      description: >-
        EXACT — Property.fromJson(). `status`/`vacant_units`/`net_profit`/
        `occupancy_rate` are pure client-side computed getters in Dart (not
        parsed from JSON) and are intentionally NOT part of this schema.
      required:
        - id
        - name
        - city
        - district
        - total_units
        - rented_units
        - monthly_income
      properties:
        id:
          type: string
          description: >-
            Parsed via `json['id'].toString()` — backend may send string or
            number (see x-backend-decisions-required: id-type-inconsistency).
          example: "1"
        name:
          type: string
          example: برج الياسمين
        city:
          type: string
          example: الرياض
        district:
          type: string
          example: حي الملقا
        image_url:
          type: string
          format: uri
          default: ""
          example: https://picsum.photos/seed/al-yasmin-tower/600/400
        total_units:
          type: integer
          example: 48
        rented_units:
          type: integer
          example: 42
        monthly_income:
          type: integer
          example: 250000
        monthly_expenses:
          type: integer
          default: 0
          example: 45000
        revenue_growth_percent:
          type: number
          format: double
          default: 0
          example: 2.4
        expenses_change_percent:
          type: number
          format: double
          default: 0
          example: -1.2
        needs_maintenance:
          type: boolean
          default: false

    PropertiesSummary:
      type: object
      description: EXACT — PropertiesSummary.fromJson().
      required: [occupancy_rate, total_properties_count, properties]
      properties:
        occupancy_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.86
        total_properties_count:
          type: integer
          example: 24
        properties:
          type: array
          items:
            $ref: "#/components/schemas/Property"

    CreatePropertyRequest:
      type: object
      description: >-
        EXACT — CreatePropertyRequest.toFormData(). Sent as multipart/
        form-data (one required cover photo).
      required: [name, type, country_code, country, city, units_count, photo]
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/PropertyType"
        country_code:
          type: string
          description: ISO 3166-1 alpha-2.
          example: SA
        country:
          type: string
          example: Saudi Arabia
        city:
          type: string
          example: الرياض
        region:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        units_count:
          type: integer
          minimum: 1
          example: 48
        description:
          type: string
          nullable: true
        photo:
          type: string
          format: binary

    # =========================================================================
    # Units
    # =========================================================================
    UnitType:
      type: string
      description: EXACT — UnitType.apiValue.
      enum: [apartment, studio, villa, office, shop, warehouse]

    UnitStatus:
      type: string
      description: EXACT — UnitStatus.apiValue.
      enum: [available, rented, maintenance]

    RentPeriod:
      type: string
      description: INFERRED wire values (no explicit apiValue in Dart).
      enum: [monthly, annually]

    UnitContract:
      type: object
      description: >-
        INFERRED — the unit's active lease, shown on its details screen.
      required:
        [tenant_name, duration_months, end_label, monthly_rent, amount_due]
      properties:
        tenant_name:
          type: string
          example: أحمد محمد عبد الله
        duration_months:
          type: integer
          example: 12
        end_label:
          type: string
          description: Pre-formatted end-of-lease label (month name).
          example: مارس
        monthly_rent:
          type: integer
          example: 5000
        amount_due:
          type: integer
          example: 2500

    Unit:
      type: object
      description: INFERRED — Unit has no fromJson; field names snake_cased.
      required:
        - id
        - property_id
        - property_name
        - unit_number
        - type
        - status
        - floor
        - area
        - rooms
        - bathrooms
        - annual_rent
        - image_urls
      properties:
        id:
          type: string
          example: "101"
        property_id:
          type: string
          example: "1"
        property_name:
          type: string
          description: Denormalized for display; not authoritative — see property_id.
          example: برج الياسمين
        unit_number:
          type: string
          example: "101"
        type:
          $ref: "#/components/schemas/UnitType"
        status:
          $ref: "#/components/schemas/UnitStatus"
        floor:
          type: integer
          example: 1
        area:
          type: integer
          description: Square meters.
          example: 120
        rooms:
          type: integer
          example: 3
        bathrooms:
          type: integer
          example: 2
        annual_rent:
          type: integer
          example: 60000
        image_urls:
          type: array
          items:
            type: string
            format: uri
        current_contract:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UnitContract"
        rent_amount:
          type: integer
          default: 0
          example: 5000
        rent_period:
          allOf:
            - $ref: "#/components/schemas/RentPeriod"
          default: monthly
        maintenance_note:
          type: string
          nullable: true
          example: صيانة سباكة طارئة

    CreateUnitRequest:
      type: object
      description: >-
        EXACT — CreateUnitRequest.toFormData(). Sent as multipart/
        form-data (0 or more photos). `amenities` is a free-form string
        array in the Flutter UI (fixed chips "kitchen"/"balcony"/"ac"/
        "parking" plus an arbitrary custom-label option) — not a closed
        enum.
      required:
        - property_id
        - floor
        - unit_number
        - type
        - area
        - rooms
        - bathrooms
        - amenities
        - annual_rent
        - status
        - photos
      properties:
        property_id:
          type: string
          example: "1"
        floor:
          type: integer
          example: 3
        unit_number:
          type: string
          example: "302"
        type:
          $ref: "#/components/schemas/UnitType"
        area:
          type: integer
          example: 130
        rooms:
          type: integer
          example: 3
        bathrooms:
          type: integer
          example: 2
        amenities:
          type: array
          items:
            type: string
          example: [kitchen, balcony, ac, parking]
        annual_rent:
          type: integer
          example: 66000
        status:
          $ref: "#/components/schemas/UnitStatus"
        photos:
          type: array
          items:
            type: string
            format: binary

    SendVacantUnitsReportRequest:
      type: object
      description: >-
        EXACT — SendVacantUnitsReportRequest.toFormData(). Sent as
        multipart/form-data. The report is rendered to a PDF entirely
        client-side (see x-backend-decisions-required:
        vacant-units-report-endpoint) and uploaded as a finished file —
        the backend does not generate or format it.
      required: [broker_id, report]
      properties:
        broker_id:
          type: string
          description: References Broker.id.
          example: "1"
        report:
          type: string
          format: binary
          description: Client-rendered PDF of vacant units.

    # =========================================================================
    # Payments
    # =========================================================================
    PaymentMethod:
      type: string
      description: EXACT — PaymentMethod.apiValue.
      enum: [bank_transfer, cash, mada, sadad, card, other]

    PaymentStatus:
      type: string
      description: INFERRED wire values (no explicit apiValue in Dart).
      enum: [paid, due, overdue]

    Payment:
      type: object
      description: INFERRED — Payment has no fromJson; field names snake_cased.
      required:
        - id
        - payer_name
        - property_unit_label
        - method
        - amount
        - status
        - date_label
      properties:
        id:
          type: string
          example: "1"
        payer_name:
          type: string
          example: أحمد محمد
        property_unit_label:
          type: string
          example: وحدة 101 - برج الياسمين
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          type: integer
          description: >-
            Whole currency units. NOTE: create-request amounts are `double`
            — see x-backend-decisions-required: currency-type-inconsistency.
          example: 5000
        status:
          $ref: "#/components/schemas/PaymentStatus"
        date_label:
          type: string
          description: Pre-formatted date string (see date-fields-are-preformatted-labels).
          example: "2024/05/02"

    PaymentsSummary:
      type: object
      description: >-
        INFERRED — PaymentsSummary has no fromJson; field names snake_cased.
      required: [total_paid, total_revenue, total_overdue, total_due, payments]
      properties:
        total_paid:
          type: integer
          example: 85000
        total_revenue:
          type: integer
          example: 125000
        total_overdue:
          type: integer
          example: 15000
        total_due:
          type: integer
          example: 25000
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"

    CreatePaymentRequest:
      type: object
      description: >-
        EXACT — CreatePaymentRequest.toFormData(). Sent as multipart/
        form-data (optional receipt image). `unit_label` is a free-text
        display label chosen from a client-side unit list, not a unit id —
        this is how the current Flutter form is wired.
      required:
        [tenant_id, property_id, unit_label, amount, payment_date, method]
      properties:
        tenant_id:
          type: string
          example: "1"
        property_id:
          type: string
          example: "1"
        unit_label:
          type: string
          example: وحدة 101 - برج الياسمين
        amount:
          type: number
          format: double
          example: 5000.0
        payment_date:
          type: string
          format: date-time
          description: DateTime.toIso8601String() from a date picker (time is midnight).
        method:
          $ref: "#/components/schemas/PaymentMethod"
        reference_number:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        receipt:
          type: string
          format: binary
          nullable: true

